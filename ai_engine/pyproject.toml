[project]
name = "broker_copilot"
version = "0.1.0"
description = "broker-copilot using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1",
]

[project.scripts]
broker_copilot = "broker_copilot.main:run"
run_crew = "broker_copilot.main:run"
train = "broker_copilot.main:train"
replay = "broker_copilot.main:replay"
test = "broker_copilot.main:test"
run_with_trigger = "broker_copilot.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
