scoring_task:
  description: >
    Analyze the provided Insurance Data JSON: {raw_data}

    Your goal is to score and rank each client for renewal priority (0-100 scale) and provide actionable sales intelligence.
    
    ### SCORING RUBRIC (Total 100pts):
    1. Premium at Risk (Max 20pts): Higher premium = higher score.
    2. Time to Expiry (Max 25pts): Expiring < 30 days or LAPSED = max score.
    3. Sentiment & Churn Risk (Max 20pts): Angry emails, service failures = max score.
    4. Claims & Past Performance (Max 20pts): Open claims, high frequency = high score.
    5. Carrier Difficulty (Max 15pts): Carrier delays or hard markets.

    ### CRITICAL DATA INSTRUCTIONS:
    - **ID MATCHING**: You MUST return the exact 'id' field from the input client object as 'record_id' in your output. Do not generate new IDs.
    - **REFERENCES**: Every major claim (Risk) or Quote (Email) must be cited in 'key_references' with its 'webLink'.

    ### ANALYSIS INSTRUCTIONS:
    1. **Reasoning (Executive Summary)**: Write a short, coherent paragraph (2 sentences) summarizing WHY the client has this score. Combine the risk factors and premiums into a narrative.
    2. **Risk Factors**: Identify specific threats (e.g., "Open Claim (Collision)", "Premium Increase > 10%").
    3. **Talking Points**: Write 3 conversational bullets the broker can use. 
       - Bad: "Mention claims."
       - Good: "I noticed the open claim from Dec 4th is still pending; shall I escalate that?"
    4. **Upsell**: Look at their industry and current policies. 
       - If they are a tech firm without Cyber, suggest it.
       - If they have inventory but no Fire/Burglary, suggest it.

    Sort the final list by Rank (1 = Highest Score).

  expected_output: >
    A JSON object containing a list of ranked renewal cards with rich analysis including reasoning and talking points.
  agent: senior_renewal_strategist

brief_generation_task:
  description: >
    Generate a "One-Page Renewal Brief" based on the specific client data provided below.

    {scoring_data}

    Your goal is to transform the technical scoring data into a readable narrative for the broker.

    ### DATA SOURCE RULES (CRITICAL):
    1. **Emails**: Cite "Outlook" if a URL is present.
    2. **Policy/Claims Data**: You MUST cite the 'csvLocation' field provided in the policy data.
       - Example: "High claims activity (Source: Excel Row 2 - ID: POL-99281)"
    3. **Risk Analysis**: Cite "AI Analysis".

    ### DECISION LOGIC (MEETING VS. EMAIL):
    Analyze the Client Health, Sentiment, and Complexity to decide the "Primary Action":
    - **IF** Risk is 'High' OR Sentiment is 'Negative' OR Claims > 0:
      - The Primary Action MUST be: "Schedule Urgent Review Meeting".
    - **IF** there is a Complex Upsell (e.g., D&O, Cyber gap):
      - The Primary Action MUST be: "Schedule Consultative Call".
    - **IF** Risk is 'Low' AND Sentiment is 'Positive' (Happy Path):
      - The Primary Action MUST be: "Send Renewal Terms via Email" (No meeting required unless requested).

    ### 4. GAP ANALYSIS & UPSELL RULES (MANDATORY):
    Check the client's 'industry' and 'current_policies'. You MUST identify at least one coverage gap using this logic:
    - **IF Tech/SaaS** AND No Cyber Liability -> Suggest: "Cyber Liability (Data Breach Protection)"
    - **IF Retail/Inventory** AND No Property/Theft -> Suggest: "Commercial Property (Theft & Spoilage)"
    - **IF Construction/Services** AND No Professional Liability -> Suggest: "E&O / Professional Liability"
    - **IF High Revenue (>$5M)** AND No D&O -> Suggest: "Directors & Officers (D&O) Insurance"
    - **IF General Fallback**: Suggest "Umbrella / Excess Liability" to increase limits.

    ### BRIEF SECTIONS REQUIRED:
    1. **Executive Summary**: A 3-sentence overview including your decision on the meeting strategy.
    2. **Financial Snapshot**: Total Premium, Days until next expiry, and carrier mix.
    3. **Key Signals**: List events driving the score with specific CITATIONS (Source & Link).
    4. **Coverage Gap Analysis**: Upsell opportunities.
    5. **Action Plan**: A step-by-step checklist.
       - **CRITICAL**: Step 1 must match your "Primary Action" decision above.
       - Example (High Risk): "1. Schedule Zoom call to discuss claims..."
       - Example (Low Risk): "1. Email renewal terms attached..."

  expected_output: >
    A structured JSON object representing the Renewal Brief, containing source links for every key data point.
  agent: renewal_brief_specialist

email_drafting_task:
  description: >
    Take the Renewal Briefs from the previous task.
    
    Using the original client data for reference:
    {scoring_data}

    For each client, draft an outreach email.

    ### STRATEGY ALIGNMENT:
    Look at the 'Action Plan' generated in the Brief.
    - If the Brief says **"Schedule Meeting"**: Your email MUST propose 2 specific timeslots and emphasize the need for a conversation.
    - If the Brief says **"Send Renewal Terms"**: Your email should attach the terms (placeholder) and ask for confirmation/signature, with a meeting only as an optional footer.

    ### TEMPLATE LOGIC:
    1. **Rescue Mission** (High Risk/Claims): Subject line must include "Urgent" or "Action Required". Tone is professional and concerned. Call to Action (CTA) is a Meeting.
    2. **Upsell** (Gap Identified): Subject line focuses on "Protection" or "Strategy". Tone is consultative. CTA is a Meeting or Call.
    3. **Happy Path** (Low Risk): Subject line is "Renewal Terms Enclosed". Tone is warm and efficient. CTA is Signature/Approval.

    Combine the Score, the Brief, and the Draft into a final package for each client.
  expected_output: >
    A FinalAgentOutput object containing a list of ClientPackages.
  agent: client_communication_specialist

  
